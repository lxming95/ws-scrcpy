name: Build ws-scrcpy armv7 tar

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build armv7 image to tar
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            -t ws-scrcpy:armv7 \
            -f Dockerfile.armv7 \
            --output type=docker,dest=./ws-scrcpy-armv7.tar \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ws-scrcpy-armv7-image
          path: ws-scrcpy-armv7.tar
          retention-days: 7
